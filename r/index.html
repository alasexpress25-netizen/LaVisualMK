<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Redirecionando…</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:#0f0f0f;color:#f5f5f5}
  .box{text-align:center;padding:24px}
  .dot{display:inline-block;width:9px;height:9px;margin:0 3px;border-radius:50%;
       background:#f5f5f5;opacity:.3;animation:b 1s infinite}
  .dot:nth-child(2){animation-delay:.15s}
  .dot:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
  p{font-size:14px;letter-spacing:.02em}
  a{color:#f5f5f5}
</style>
</head>
<body>
  <div class="box">
    <p><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
    <p>Redirecionando…</p>
    <noscript>
      <p>Ative o JavaScript ou <a href="https://lavisualmk.alastecno.com/">acesse o site</a>.</p>
    </noscript>
  </div>

<script>
(function () {
  var TRACK    = "https://redaqqxoeciycqgjhpbv.supabase.co/functions/v1/track-click";
  var FALLBACK = "https://lavisualmk.alastecno.com/";
  var ALLOWED  = ["c", "src", "post", "kw"];

  function go(u) { window.location.replace(u); }

  var qs, params;
  try {
    qs = new URLSearchParams(window.location.search);
    params = new URLSearchParams();
    ALLOWED.forEach(function (k) {
      var v = qs.get(k);
      if (v) params.set(k, v);
    });
  } catch (e) {
    return go(FALLBACK);
  }

  // Sem client id não há o que rastrear
  if (!params.get("c")) return go(FALLBACK);

  var jsonUrl = TRACK + "?" + params.toString() + "&format=json";

  // Se a rede travar, não deixamos a pessoa presa nesta tela:
  // caímos para o redirect 302 normal do próprio track-click.
  var done = false;
  var timer = setTimeout(function () {
    if (!done) { done = true; go(TRACK + "?" + params.toString()); }
  }, 2500);

  fetch(jsonUrl, { method: "GET", mode: "cors", cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      go(data && data.url ? data.url : FALLBACK);
    })
    .catch(function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      go(TRACK + "?" + params.toString());
    });
})();
</script>
</body>
</html>
